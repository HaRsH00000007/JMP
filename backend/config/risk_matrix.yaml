# Danone likelihood × consequence matrix — transcribed from the Excel "Risk Matrix" sheet.
# The sheet contains only an image (xl/media/image1.png). Ingestion recomputes that image's SHA-256
# and refuses to load if it differs from `source_image_sha256` below: a changed image must be
# re-transcribed and re-reviewed (never silently reused).
version: "1.0"
source: "JMP Template- 25 Hazards.xlsx :: Risk Matrix (image1.png)"
source_image_sha256: "d04050dae34758ff1446d2c70c91588da0abc8ebe3a88984697648faf0c4563b"

# D-01 (proposed default, pending Danone EHS): the report DISPLAYS the severity-only band used by the
# master PDF; the matrix zone is stored alongside and shown in the hazard table as a reference column.
# Switch to "matrix_zone" to display the Danone matrix instead.
display_band_method: severity_band        # severity_band | matrix_zone

# Severity-only band (master PDF page-5 footnote): 5=HIGH, 4=MEDIUM, <=3=LOW
severity_band:
  5: HIGH
  4: MEDIUM
  3: LOW
  2: LOW
  1: LOW

# D-02 (proposed default): matrix colours map to HIGH/MEDIUM/LOW; no CRITICAL level exists.
zone_labels:
  RED: HIGH
  YELLOW: MEDIUM
  GREEN: LOW

# Rows = severity 1..5, columns = probability A..E  (G=GREEN, Y=YELLOW, R=RED)
cells:
  1: {A: GREEN, B: GREEN, C: GREEN, D: GREEN, E: GREEN}
  2: {A: GREEN, B: GREEN, C: GREEN, D: YELLOW, E: YELLOW}
  3: {A: GREEN, B: GREEN, C: YELLOW, D: YELLOW, E: RED}
  4: {A: GREEN, B: YELLOW, C: YELLOW, D: RED, E: RED}
  5: {A: YELLOW, B: YELLOW, C: RED, D: RED, E: RED}

likelihood:
  A: {label: "Almost impossible", description: "Has occurred > 20 years, once in a lifetime"}
  B: {label: "Unlikely", description: "Has occurred once in last 10 years"}
  C: {label: "Unusual", description: "Has occurred once in last 1 -3 years"}
  D: {label: "Possible", description: "Has occurred once in the last 6 months"}
  E: {label: "Predictable / Expected", description: "Has occurred once in the last week"}

consequence:
  1: {label: "Negligible (No injury)", people: "No injuries or health effect"}
  2: {label: "Minor (First aid case)", people: "Minor Injury"}
  3: {label: "Important (LTA/NLTA)", people: "Major Injury or Health effect (recordable accident)"}
  4: {label: "Severe (Permanent injuries / disability)", people: "Disability or permanent effect"}
  5: {label: "Major (1 or more fatalities)", people: "1 or more fatalities"}
