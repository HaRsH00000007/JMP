[project]
name = "jmp-generator"
version = "1.0.0"
description = "Journey Management Plan generator — FastAPI backend, hazard engine, Claude narrative, Playwright PDF"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=1.7",
    "jinja2>=3.1",
    "playwright>=1.48",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "structlog>=24.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "render: tests that launch Chromium (Playwright)",
    "live: tests that call real external services (skipped unless enabled)",
]
filterwarnings = ["ignore::DeprecationWarning"]
